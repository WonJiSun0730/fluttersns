name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Spring Boot
        run: mvn -B -f server/pom.xml verify
      - name: Prepare Android and analyze
        working-directory: mobile
        run: |
          pwsh -File ./setup-android.ps1
          flutter analyze
      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moa-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start API
        working-directory: server
        run: |
          java -jar target/mini-social-1.0.0.jar > "$RUNNER_TEMP/moa-server.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/api/posts; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/moa-server.log"
          exit 1
      - name: Run Android integration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: cd mobile && flutter test integration_test/feed_test.dart -d emulator-5554
